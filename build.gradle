plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.qevro.escalux'
version = '1.0.1'
archivesBaseName = 'Escalux'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { escalux { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // Create is intentionally optional. Add its matching Forge 1.20.1 artifact
    // only when implementing/testing the kinetic API bridge for your Create version.
}

processResources {
    def props = [mod_id: 'escalux', mod_name: 'Escalux', mod_version: project.version,
                 mod_license: 'All Rights Reserved', mod_authors: 'Qevro',
                 mod_description: 'Original metro-style escalators for Minecraft.']
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

jar {
    manifest { attributes(['Specification-Title': 'Escalux', 'Specification-Vendor': 'Qevro', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) }
    finalizedBy 'reobfJar'
}
